<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Intelligence System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #38bdf8; text-align: center; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 4px; background-color: #0f172a; color: #e2e8f0; box-sizing: border-box; }
        button { background-color: #2563eb; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #1d4ed8; }
        .result { display: none; margin-top: 20px; padding: 15px; border-radius: 5px; }
        .result.high-risk { background-color: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; }
        .result.low-risk { background-color: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; }
        .result p { margin: 5px 0; }
        .result span { font-weight: bold; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #38bdf8; text-decoration: none; font-size: 18px; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fraud Analytics & AI Intelligence</h1>
        
        <div class="card">
            <h2>Transaction Simulator</h2>
            <form id="predict-form">
                <div class="form-group">
                    <label>Transaction Amount ($)</label>
                    <input type="number" id="amt" value="250" required>
                </div>
                <div class="form-group">
                    <label>Merchant Category</label>
                    <select id="category">
                        <option value="grocery_pos">Grocery POS</option>
                        <option value="shopping_net">Shopping Net</option>
                        <option value="misc_net">Misc Net</option>
                        <option value="gas_transport">Gas Transport</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Hour of Day (0-23)</label>
                    <input type="number" id="hour" value="23" min="0" max="23" required>
                </div>
                <div class="form-group">
                    <label>Distance from Home (km)</label>
                    <input type="number" id="distance_km" value="120" required>
                </div>
                <button type="submit">Analyze Transaction</button>
            </form>
        </div>

        <div id="result-card" class="card result">
            <h2 id="res-prediction">Evaluating...</h2>
            <p>Risk Score: <span id="res-score"></span> (<span id="res-level"></span>)</p>
            <p>Insight: <span id="res-insight"></span></p>
            <p>AI Explanation: <span id="res-explanation"></span></p>
            <p>Action Recommendation: <span id="res-recommendation"></span></p>
        </div>

        <div class="links">
            <a href="/dashboard">📊 View Full Analytics Dashboard</a>
        </div>
    </div>

    <script>
        document.getElementById('predict-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const hour = parseInt(document.getElementById('hour').value);
            const isNight = (hour >= 22 || hour <= 4) ? 1 : 0;
            
            const data = {
                amt: parseFloat(document.getElementById('amt').value),
                category: document.getElementById('category').value,
                hour: hour,
                is_night: isNight,
                distance_km: parseFloat(document.getElementById('distance_km').value)
            };

            const response = await fetch('/api/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            const resultCard = document.getElementById('result-card');
            resultCard.style.display = 'block';
            
            if (result.prediction === "Fraud") {
                resultCard.className = 'card result high-risk';
                document.getElementById('res-prediction').innerText = '🚨 FRAUD DETECTED';
                document.getElementById('res-prediction').style.color = '#ef4444';
            } else {
                resultCard.className = 'card result low-risk';
                document.getElementById('res-prediction').innerText = '✅ LEGITIMATE';
                document.getElementById('res-prediction').style.color = '#22c55e';
            }

            document.getElementById('res-score').innerText = result.risk_score + '/100';
            document.getElementById('res-level').innerText = result.risk_level;
            document.getElementById('res-insight').innerText = result.insight;
            document.getElementById('res-explanation').innerText = result.explanation;
            document.getElementById('res-recommendation').innerText = result.recommendation;
        });
    </script>
</body>
</html>
